# Publishes the web app (public/) to the gh-pages branch, which GitHub Pages serves.
name: Deploy site

on:
  push:
    branches: [main, build/gimrit-app]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish public/ to gh-pages
        env:
          API_URL: ${{ vars.GIMRIT_API_URL }}
        run: |
          cd public
          touch .nojekyll
          # Point the site at the Gimrit server (repo Settings → Secrets and variables → Actions → Variables)
          if [ -n "$API_URL" ]; then
            printf "export const API_URL = '%s';\n" "$API_URL" > js/config.js
          fi
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
